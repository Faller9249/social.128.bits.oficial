<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>128.bits.oficial | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124, 58, 237, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(16, 185, 129, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 2rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Profile */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
    }

    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      animation: spin 6s linear infinite;
      z-index: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: #0a0a0f;
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg, #1e1b4b, #0e7490);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      user-select: none;
    }

    .profile-name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #f1f5f9 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-bio {
      font-size: 0.875rem;
      color: var(--text-muted);
      max-width: 300px;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #c4b5fd;
    }

    .badge i { font-size: 0.7rem; }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .link-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .link-card:active {
      transform: translateY(0);
    }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .link-text {
      flex: 1;
    }

    .link-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .link-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .link-arrow {
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.2s;
    }

    .link-card:hover .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    /* Individual platform colors */
    .icon-instagram  { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .icon-tiktok     { background: linear-gradient(135deg, #010101, #69c9d0, #ee1d52); }
    .icon-youtube    { background: #ff0000; }
    .icon-discord    { background: #5865f2; }
    .icon-livepix    { background: linear-gradient(135deg, #00c2ff, #0066ff); }
    .icon-blog       { background: linear-gradient(135deg, #f97316, #fb923c); }

    /* Footer */
    .footer {
      font-size: 0.72rem;
      color: rgba(148, 163, 184, 0.4);
      text-align: center;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--accent2);
      border-radius: 50%;
      opacity: 0;
      animation: float-up var(--dur) var(--delay) ease-in infinite;
    }

    @keyframes float-up {
      0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-10vh) translateX(var(--drift)); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <div class="container">

    <!-- Profile -->
    <div class="profile">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">128</div>
      </div>
      <div>
        <div class="profile-name">128.bits.oficial</div>
        <div class="profile-bio">Conteúdo tech, jogos e cultura digital.</div>
      </div>
      <div class="badge">
        <i class="fa-solid fa-circle-dot" style="color:#22c55e"></i>
        Online
      </div>
    </div>

    <!-- Links -->
    <div class="links">

      <a class="link-card" href="https://www.instagram.com/128.bits.oficial/" target="_blank" rel="noopener">
        <div class="link-icon icon-instagram">
          <i class="fa-brands fa-instagram" style="color:#fff"></i>
        </div>
        <div class="link-text">
          <div class="link-title">Instagram</div>
          <div class="link-subtitle">@128.bits.oficial</div>
        </div>
        <i class="fa-solid fa-arrow-right link-arrow"></i>
      </a>

      <a class="link-card" href="https://www.tiktok.com/@128.bits.oficial" target="_blank" rel="noopener">
        <div class="link-icon icon-tiktok">
          <i class="fa-brands fa-tiktok" style="color:#fff"></i>
        </div>
        <div class="link-text">
          <div class="link-title">TikTok</div>
          <div class="link-subtitle">@128.bits.oficial</div>
        </div>
        <i class="fa-solid fa-arrow-right link-arrow"></i>
      </a>

      <a class="link-card" href="https://www.youtube.com/@128.bits.oficial" target="_blank" rel="noopener">
        <div class="link-icon icon-youtube">
          <i class="fa-brands fa-youtube" style="color:#fff"></i>
        </div>
        <div class="link-text">
          <div class="link-title">YouTube</div>
          <div class="link-subtitle">@128.bits.oficial</div>
        </div>
        <i class="fa-solid fa-arrow-right link-arrow"></i>
      </a>

      <a class="link-card" href="https://discord.gg/yjJ5rz3xWn" target="_blank" rel="noopener">
        <div class="link-icon icon-discord">
          <i class="fa-brands fa-discord" style="color:#fff"></i>
        </div>
        <div class="link-text">
          <div class="link-title">Discord</div>
          <div class="link-subtitle">Entre na nossa comunidade</div>
        </div>
        <i class="fa-solid fa-arrow-right link-arrow"></i>
      </a>

      <a class="link-card" href="https://tr.ee/UFYhSJy2Y9" target="_blank" rel="noopener">
        <div class="link-icon icon-livepix">
          <i class="fa-solid fa-bolt" style="color:#fff"></i>
        </div>
        <div class="link-text">
          <div class="link-title">LivePix</div>
          <div class="link-subtitle">Apoie o canal</div>
        </div>
        <i class="fa-solid fa-arrow-right link-arrow"></i>
      </a>

      <a class="link-card" href="https://diariosdesobreviventes.blogspot.com/" target="_blank" rel="noopener">
        <div class="link-icon icon-blog">
          <i class="fa-solid fa-book-open" style="color:#fff"></i>
        </div>
        <div class="link-text">
          <div class="link-title">Diários de Sobreviventes</div>
          <div class="link-subtitle">Blog</div>
        </div>
        <i class="fa-solid fa-arrow-right link-arrow"></i>
      </a>

    </div>

    <div class="footer">© 2025 128.bits.oficial · Feito com 💜</div>
  </div>

  <script>
    // Generate floating particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.setProperty('--dur', (8 + Math.random() * 12) + 's');
      p.style.setProperty('--delay', (Math.random() * 10) + 's');
      p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = Math.random() > 0.5 ? '#7c3aed' : '#06b6d4';
      container.appendChild(p);
    }
  </script>

</body>
</html>
