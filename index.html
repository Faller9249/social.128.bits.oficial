<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #cb00ff;
      --yellow: #f0ff00;
      --bg:     #080808;
      --glass-bg:     rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --text:       #ffffff;
      --text-muted: #a1a1aa;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      opacity: 0;
      animation: float-up var(--dur) var(--delay) ease-in infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.1; }
      100% { transform: translateY(-10vh) translateX(var(--drift)); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .profile { display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
    .avatar-wrap { position: relative; width: 100px; height: 100px; }
    .avatar-ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(var(--purple), var(--yellow), var(--purple));
      animation: spin 5s linear infinite; z-index: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-ring::after {
      content: ''; position: absolute; inset: 3px;
      border-radius: 50%; background: var(--bg);
    }
    .avatar {
      position: relative; z-index: 1;
      width: 100px; height: 100px;
      border-radius: 50%; object-fit: cover; display: block;
    }
    .avatar-fallback {
      background: linear-gradient(135deg, #1a001f, #2a003a);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700;
      color: var(--purple); letter-spacing: -1px; user-select: none;
    }
    .profile-name {
      font-size: 1.4rem; font-weight: 700; letter-spacing: -0.4px;
      background: linear-gradient(110deg, #fff 20%, var(--yellow) 60%, var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .profile-bio { font-size: 0.875rem; color: var(--text-muted); max-width: 300px; line-height: 1.55; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(203,0,255,0.12); border: 1px solid rgba(203,0,255,0.30);
      border-radius: 999px; padding: 0.28rem 0.85rem;
      font-size: 0.73rem; font-weight: 600; color: #e580ff; letter-spacing: 0.3px;
    }
    .badge i { font-size: 0.65rem; }

    .links { width: 100%; display: flex; flex-direction: column; gap: 0.7rem; }
    .link-card {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.2rem;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 14px; text-decoration: none; color: var(--text);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transition: transform .2s, background .2s, border-color .2s, box-shadow .2s;
    }
    .link-card:hover {
      transform: translateY(-2px);
      background: rgba(203,0,255,0.07); border-color: rgba(203,0,255,0.30);
      box-shadow: 0 6px 28px rgba(203,0,255,0.15);
    }
    .link-card:active { transform: translateY(0); }
    .link-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; }
    .link-text { flex: 1; }
    .link-title { font-size: .93rem; font-weight: 600; }
    .link-subtitle { font-size: .73rem; color: var(--text-muted); margin-top: .1rem; }
    .link-arrow { font-size: .78rem; color: var(--text-muted); opacity: .5; transition: opacity .2s, transform .2s; }
    .link-card:hover .link-arrow { opacity: 1; transform: translateX(3px); color: var(--yellow); }
    .icon-instagram { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
    .icon-tiktok    { background: linear-gradient(135deg,#111,#69c9d0 50%,#ee1d52); }
    .icon-youtube   { background: #f00; }
    .icon-discord   { background: #5865f2; }
    .icon-livepix   { background: linear-gradient(135deg,#00c2ff,#0055ff); }
    .icon-blog      { background: linear-gradient(135deg,#cb00ff,#7700aa); }

    .footer { font-size: .7rem; color: rgba(255,255,255,.2); text-align: center; }
  </style>
</head>
<body>

  <script>
  (() => {
    const canvas = document.getElementById('bg');
    const ctx    = canvas.getContext('2d');

    const NS = 512;
    const ng = new Float32Array(NS * NS);
    let seed = 0x9e3779b9;
    const rng = () => {
      seed = Math.imul(seed ^ seed >>> 16, 0x45d9f3b);
      seed = Math.imul(seed ^ seed >>> 16, 0x45d9f3b);
      return ((seed ^ seed >>> 16) >>> 0) / 0x100000000;
    };
    for (let i = 0; i < ng.length; i++) ng[i] = rng();

    const sm = t => t * t * (3 - 2 * t);

    function vn(x, y) {
      const xi = ((Math.floor(x) % NS) + NS) % NS;
      const yi = ((Math.floor(y) % NS) + NS) % NS;
      const xf = x - Math.floor(x), yf = y - Math.floor(y);
      const u  = sm(xf), v = sm(yf);
      const x1 = (xi+1) % NS, y1 = (yi+1) % NS;
      const a = ng[yi*NS+xi], b = ng[yi*NS+x1];
      const c = ng[y1*NS+xi], d = ng[y1*NS+x1];
      return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
    }

    function fbm(x, y) {
      return vn(x,   y  )*0.500 + vn(x*2,y*2)*0.250
           + vn(x*4, y*4)*0.125 + vn(x*8,y*8)*0.0625;
    }

    const BAKE = 512;
    const noc  = document.createElement('canvas');
    noc.width = noc.height = BAKE;
    const nctx = noc.getContext('2d');
    const imd  = nctx.createImageData(BAKE, BAKE);
    const nd   = imd.data;

    const NSCL = 3.5, THR = 0.50, SOFT = 0.10;
    for (let y = 0; y < BAKE; y++) {
      for (let x = 0; x < BAKE; x++) {
        const v = fbm((x/BAKE)*NSCL, (y/BAKE)*NSCL);
        let b   = Math.max(0, Math.min(1, (v - THR + SOFT) / (SOFT*2)));
        b = sm(b);
        const i = (y*BAKE+x)*4;
        nd[i] = nd[i+1] = nd[i+2] = b*255|0;
        nd[i+3] = 255;
      }
    }
    nctx.putImageData(imd, 0, 0);

    const goc  = document.createElement('canvas');
    const gctx = goc.getContext('2d');
    const GRID = 40;

    function buildGrid(W, H) {
      goc.width = W; goc.height = H;
      gctx.clearRect(0, 0, W, H);
      gctx.strokeStyle = '#cb00ff';
      gctx.lineWidth   = 1;
      gctx.shadowColor = '#cb00ff';
      gctx.shadowBlur  = 8;
      for (let x = 0; x <= W; x += GRID) {
        gctx.beginPath(); gctx.moveTo(x+.5, 0); gctx.lineTo(x+.5, H); gctx.stroke();
      }
      for (let y = 0; y <= H; y += GRID) {
        gctx.beginPath(); gctx.moveTo(0, y+.5); gctx.lineTo(W, y+.5); gctx.stroke();
      }
      gctx.shadowColor = '#f0ff00';
      gctx.shadowBlur  = 14;
      gctx.fillStyle   = '#f0ff00';
      for (let x = GRID*2; x < W; x += GRID*4) {
        for (let y = GRID*2; y < H; y += GRID*4) {
          gctx.beginPath(); gctx.arc(x, y, 1.8, 0, Math.PI*2); gctx.fill();
        }
      }
    }

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      buildGrid(window.innerWidth, window.innerHeight);
    }
    resize();
    window.addEventListener('resize', resize);

    const SPX = 0.011, SPY = 0.007;

    function render(ts) {
      const W = canvas.width, H = canvas.height;
      const TW = Math.max(W, H) * 1.6;
      const ox = (ts * SPX) % TW;
      const oy = (ts * SPY) % TW;

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle   = '#080808';
      ctx.fillRect(0, 0, W, H);

      ctx.drawImage(goc, 0, 0);

      ctx.globalCompositeOperation = 'multiply';
      ctx.imageSmoothingEnabled    = true;
      for (let tx = -ox; tx < W + TW; tx += TW) {
        for (let ty = -oy; ty < H + TW; ty += TW) {
          ctx.drawImage(noc, tx, ty, TW, TW);
        }
      }

      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.07;
      for (let tx = -ox; tx < W + TW; tx += TW) {
        for (let ty = -oy; ty < H + TW; ty += TW) {
          ctx.drawImage(noc, tx, ty, TW, TW);
        }
      }

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  })();

  (() => {
    const p = document.getElementById('particles');
    const c = ['#cb00ff','#f0ff00','#ffffff'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.style.setProperty('--dur',   (9+Math.random()*12)+'s');
      el.style.setProperty('--delay', (Math.random()*12)+'s');
      el.style.setProperty('--drift', (Math.random()*120-60)+'px');
      el.style.left       = (Math.random()*100)+'%';
      el.style.background = c[Math.floor(Math.random()*c.length)];
      p.appendChild(el);
    }
  })();
  <\/script>

</body>
